services:
  - type: web
    name: crosscode-web
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crosscode-postgres
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_BETTER_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Optional extras you can add later in the Dashboard:
      # SMTP_HOST/SMTP_PORT/SMTP_SECURE/SMTP_USER/SMTP_PASSWORD/SMTP_FROM/SMTP_FROM_NAME (email)
      # NEXT_PUBLIC_SANITY_PROJECT_ID/NEXT_PUBLIC_SANITY_DATASET/SANITY_API_READ_TOKEN (CMS)
      # DODO_PAYMENTS_API_KEY/DODO_PAYMENTS_WEBHOOK_KEY/DODO_PRODUCT_* (payments)
      # UPSTASH_REDIS_REST_URL/UPSTASH_REDIS_REST_TOKEN (rate limiting)
      # TURNSTILE_SECRET_KEY/NEXT_PUBLIC_TURNSTILE_SITE_KEY (captcha)
      # SENTRY_DSN/NEXT_PUBLIC_SENTRY_DSN/SENTRY_ORG/SENTRY_PROJECT/SENTRY_AUTH_TOKEN (errors)

databases:
  - name: crosscode-postgres
    databaseName: crosscode
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []